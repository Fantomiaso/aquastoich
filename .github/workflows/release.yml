name: Build and release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: win
            buildFlags: ''
          - os: macos-latest
            target: mac
            buildFlags: '--x64 --arm64'
          - os: ubuntu-latest
            target: linux
            buildFlags: ''
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v6
        with:
          version: 11.19.0
          run_install: false
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm test
      - name: Build standalone package
        run: pnpm exec electron-builder --${{ matrix.target }} ${{ matrix.buildFlags }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: package-${{ matrix.target }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.zip
            dist/*.deb
            dist/*.AppImage
            dist/*.blockmap
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: package-*
          path: release
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          name: AquaStoich 1.0a · Testing / Тестирование
          prerelease: true
          body_path: RELEASE_NOTES.md
          files: release/*
